<!DOCTYPE html>
<html lang="en" data-theme="evening">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f1412" />
    <meta
      name="description"
      content="NiveshBuddy: build rules-based strategies on NSE stocks and backtest them on historical data."
    />
    <script>
      // Apply the saved theme before first paint so the page never flashes the wrong one
      (function () {
        var t = "evening";
        try { if (localStorage.getItem("nb-theme") === "daylight") t = "daylight"; } catch (e) {}
        document.documentElement.setAttribute("data-theme", t);
        var m = document.querySelector('meta[name="theme-color"]');
        if (m && t === "daylight") m.setAttribute("content", "#f2f5f1");
      })();
    </script>
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <title>NiveshBuddy · Backtest equity strategies</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
